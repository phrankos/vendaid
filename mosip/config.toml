[mosip_auth]
timestamp_format = "%Y-%m-%dT%H:%M:%S"
ida_auth_version = "1.0"
ida_auth_request_demo_id = "mosip.identity.auth"
ida_auth_request_kyc_id = "mosip.identity.kyc"
ida_auth_request_otp_id = "mosip.identity.otp"
ida_auth_env = "Staging"
authorization_header_constant = "Authorization"
partner_apikey = "336368"
partner_misp_lk = "ulFV6JECDlCKf9l3bKRXyZElq5P3G0fKC3tePHYjWOHHmMeGWL"
partner_id = "cs145-252-16"

[mosip_auth_server]
ida_auth_domain_uri = "https://api-internal.pdec.mosip.net"
ida_auth_url = "https://api-internal.pdec.mosip.net/idauthentication/v1"

[crypto_encrypt]
symmetric_key_size = 256
symmetric_nonce_size = 128
symmetric_gcm_tag_size = 128
encrypt_cert_path = "./pdec_ida_partner.pem"
decrypt_p12_file_path = "./keystore-signed.p12"
decrypt_p12_file_password = "cs145-252-16@12345"

[crypto_signature]
algorithm = "RS256"
sign_p12_file_path = "./keystore-signed.p12"
sign_p12_file_password = "cs145-252-16@12345"

[face]
model            = "Facenet512"
distance_metric  = "cosine"
threshold        = 0.40   # raise above DeepFace default (0.30) to reduce false rejections

[kyc]
attempt_timeout_s = 6    # seconds before a single attempt is considered hung
max_retries       = 20   # total attempts before giving up
retry_delay_s     = 2    # wait between retries
# Worst case: 10×5 + 9×2 = 68s — fits within Laravel 200s and Arduino 240s

[mock]
# Set enabled = true to use the prof's mock server instead of the real MOSIP testbed.
# No certificates or SDK crypto are needed in mock mode.
enabled = false
url = "https://cs145-iot-cup-1745973870.ap-southeast-1.elb.amazonaws.com"

[logging]
log_file_path = "/tmp/authenticator.log"
log_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
loglevel = "INFO"
